<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Status Code Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 2rem 1rem;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            color: white;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-container {
            max-width: 300px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .status-card:hover::before {
            transform: scaleX(1);
        }

        .status-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .status-code {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-name {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .status-description {
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .status-category {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-1xx { background: #e8f4fd; color: #1e88e5; }
        .category-2xx { background: #e8f5e8; color: #43a047; }
        .category-3xx { background: #fff3e0; color: #fb8c00; }
        .category-4xx { background: #ffebee; color: #e53935; }
        .category-5xx { background: #f3e5f5; color: #8e24aa; }

        .visual-metaphor {
            margin: 1.5rem 0;
            text-align: center;
            font-size: 4rem;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Special animations */
        .bounce { animation: bounce 2s infinite; }
        .spin { animation: spin 3s linear infinite; }
        .pulse { animation: pulse 2s infinite; }
        .shake { animation: shake 0.5s infinite; }
        .wiggle { animation: wiggle 1s infinite; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }

        /* Special teapot styling */
        .teapot-card {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            border: 3px solid #ff6b9d;
            position: relative;
        }

        .teapot-card::after {
            content: '✨';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5rem;
            animation: pulse 1s infinite;
        }

        .teapot-visual {
            font-size: 5rem;
            animation: wiggle 2s infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            margin: 2rem;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #999;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
            text-align: center;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .gallery { grid-template-columns: 1fr; padding: 1rem; }
            .controls { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>HTTP Status Code Visualizer</h1>
        <p>An interactive journey through the language of the web</p>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalCodes">0</div>
                <div class="stat-label">Status Codes</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="visibleCodes">0</div>
                <div class="stat-label">Visible</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="categories">5</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>

        <div class="controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="1xx">1xx Informational</button>
            <button class="filter-btn" data-filter="2xx">2xx Success</button>
            <button class="filter-btn" data-filter="3xx">3xx Redirection</button>
            <button class="filter-btn" data-filter="4xx">4xx Client Error</button>
            <button class="filter-btn" data-filter="5xx">5xx Server Error</button>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search status codes..." id="searchInput">
        </div>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const statusCodes = [
            // 1xx Informational
            { code: 100, name: 'Continue', description: 'The server has received the request headers and should continue to send the request body.', emoji: '🏃', animation: 'bounce', category: '1xx' },
            { code: 101, name: 'Switching Protocols', description: 'The requester has asked the server to switch protocols and the server has agreed.', emoji: '🔄', animation: 'spin', category: '1xx' },
            { code: 102, name: 'Processing', description: 'The server is processing the request but no response is available yet.', emoji: '⚙️', animation: 'spin', category: '1xx' },
            
            // 2xx Success
            { code: 200, name: 'OK', description: 'The request has succeeded. The meaning depends on the HTTP method used.', emoji: '✅', animation: 'pulse', category: '2xx' },
            { code: 201, name: 'Created', description: 'The request has been fulfilled, resulting in the creation of a new resource.', emoji: '🎉', animation: 'bounce', category: '2xx' },
            { code: 202, name: 'Accepted', description: 'The request has been accepted for processing, but processing is not complete.', emoji: '👍', animation: 'pulse', category: '2xx' },
            { code: 204, name: 'No Content', description: 'The server successfully processed the request, but is not returning any content.', emoji: '🤐', animation: '', category: '2xx' },
            { code: 206, name: 'Partial Content', description: 'The server is delivering only part of the resource due to a range header.', emoji: '🍕', animation: 'wiggle', category: '2xx' },
            
            // 3xx Redirection
            { code: 301, name: 'Moved Permanently', description: 'The resource has been assigned a new permanent URI.', emoji: '📦', animation: 'bounce', category: '3xx' },
            { code: 302, name: 'Found', description: 'The resource temporarily resides under a different URI.', emoji: '🔍', animation: 'wiggle', category: '3xx' },
            { code: 304, name: 'Not Modified', description: 'The resource has not been modified since the last request.', emoji: '📋', animation: '', category: '3xx' },
            { code: 307, name: 'Temporary Redirect', description: 'The request should be repeated with another URI temporarily.', emoji: '🔀', animation: 'bounce', category: '3xx' },
            { code: 308, name: 'Permanent Redirect', description: 'The request should be repeated with another URI permanently.', emoji: '➡️', animation: 'bounce', category: '3xx' },
            
            // 4xx Client Error
            { code: 400, name: 'Bad Request', description: 'The server cannot process the request due to client error.', emoji: '❌', animation: 'shake', category: '4xx' },
            { code: 401, name: 'Unauthorized', description: 'Authentication is required and has failed or not been provided.', emoji: '🔐', animation: 'shake', category: '4xx' },
            { code: 403, name: 'Forbidden', description: 'The server understood the request but refuses to authorize it.', emoji: '⛔', animation: 'shake', category: '4xx' },
            { code: 404, name: 'Not Found', description: 'The server has not found anything matching the request URI.', emoji: '🤷', animation: 'wiggle', category: '4xx' },
            { code: 405, name: 'Method Not Allowed', description: 'The method specified in the request is not allowed for the resource.', emoji: '🚫', animation: 'shake', category: '4xx' },
            { code: 408, name: 'Request Timeout', description: 'The server timed out waiting for the request.', emoji: '⏰', animation: 'pulse', category: '4xx' },
            { code: 409, name: 'Conflict', description: 'The request conflicts with the current state of the server.', emoji: '⚔️', animation: 'shake', category: '4xx' },
            { code: 410, name: 'Gone', description: 'The resource is no longer available and will not be available again.', emoji: '👻', animation: 'wiggle', category: '4xx' },
            { code: 418, name: "I'm a teapot", description: 'The server refuses to brew coffee because it is, permanently, a teapot. This is a reference to the 1998 April Fools\' joke "Hyper Text Coffee Pot Control Protocol".', emoji: '🫖', animation: 'wiggle', category: '4xx', special: true },
            { code: 429, name: 'Too Many Requests', description: 'The user has sent too many requests in a given amount of time.', emoji: '🚦', animation: 'pulse', category: '4xx' },
            
            // 5xx Server Error
            { code: 500, name: 'Internal Server Error', description: 'The server encountered an unexpected condition that prevented it from fulfilling the request.', emoji: '💥', animation: 'shake', category: '5xx' },
            { code: 501, name: 'Not Implemented', description: 'The server does not support the functionality required to fulfill the request.', emoji: '🚧', animation: 'wiggle', category: '5xx' },
            { code: 502, name: 'Bad Gateway', description: 'The server received an invalid response from the upstream server.', emoji: '🌉', animation: 'shake', category: '5xx' },
            { code: 503, name: 'Service Unavailable', description: 'The server is currently unavailable due to temporary overloading or maintenance.', emoji: '🔧', animation: 'wiggle', category: '5xx' },
            { code: 504, name: 'Gateway Timeout', description: 'The server did not receive a timely response from the upstream server.', emoji: '⏳', animation: 'pulse', category: '5xx' },
            { code: 505, name: 'HTTP Version Not Supported', description: 'The server does not support the HTTP protocol version used in the request.', emoji: '📊', animation: 'shake', category: '5xx' }
        ];

        let currentFilter = 'all';
        let searchTerm = '';

        function createStatusCard(status) {
            const card = document.createElement('div');
            const isTeapot = status.code === 418;
            
            card.className = `status-card ${isTeapot ? 'teapot-card' : ''}`;
            card.dataset.category = status.category;
            card.onclick = () => showModal(status);
            
            card.innerHTML = `
                <div class="status-code">${status.code}</div>
                <div class="status-name">${status.name}</div>
                <div class="visual-metaphor ${status.animation} ${isTeapot ? 'teapot-visual' : ''}">
                    ${status.emoji}
                </div>
                <div class="status-description">${status.description.substring(0, 120)}${status.description.length > 120 ? '...' : ''}</div>
                <div class="status-category category-${status.category}">${status.category} ${getCategoryName(status.category)}</div>
            `;
            
            return card;
        }

        function getCategoryName(category) {
            const names = {
                '1xx': 'Informational',
                '2xx': 'Success',
                '3xx': 'Redirection',
                '4xx': 'Client Error',
                '5xx': 'Server Error'
            };
            return names[category] || '';
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            const filteredCodes = statusCodes.filter(status => {
                const matchesFilter = currentFilter === 'all' || status.category === currentFilter;
                const matchesSearch = !searchTerm || 
                    status.code.toString().includes(searchTerm) ||
                    status.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    status.description.toLowerCase().includes(searchTerm.toLowerCase());
                
                return matchesFilter && matchesSearch;
            });
            
            filteredCodes.forEach((status, index) => {
                const card = createStatusCard(status);
                card.style.animationDelay = `${index * 0.1}s`;
                gallery.appendChild(card);
            });
            
            updateStats(filteredCodes.length);
        }

        function updateStats(visibleCount) {
            document.getElementById('totalCodes').textContent = statusCodes.length;
            document.getElementById('visibleCodes').textContent = visibleCount;
        }

        function showModal(status) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <div style="text-align: center;">
                    <div class="status-code" style="font-size: 4rem;">${status.code}</div>
                    <h2 style="color: #2c3e50; margin-bottom: 1rem;">${status.name}</h2>
                    <div style="font-size: 4rem; margin: 1rem 0;" class="${status.animation}">
                        ${status.emoji}
                    </div>
                    <div class="status-category category-${status.category}" style="margin: 1rem 0;">
                        ${status.category} ${getCategoryName(status.category)}
                    </div>
                    <p style="color: #7f8c8d; line-height: 1.8; margin: 1.5rem 0;">${status.description}</p>
                    ${status.code === 418 ? '<p style="color: #e74c3c; font-weight: bold;">🎉 Easter Egg Found! This is the famous teapot status code from RFC 2324! 🎉</p>' : ''}
                    <div style="background: #f8f9fa; padding: 1rem; border-radius: 10px; margin-top: 1rem;">
                        <h4 style="color: #2c3e50; margin-bottom: 0.5rem;">Technical Details:</h4>
                        <p style="color: #666; font-size: 0.9rem;">
                            Category: ${getCategoryName(status.category)}<br>
                            Cacheable: ${status.category === '2xx' || status.category === '3xx' ? 'Yes' : 'No'}<br>
                            Common Use: ${getCommonUse(status.code)}
                        </p>
                    </div>
                </div>
            `;
            
            modal.style.display = 'flex';
        }

        function getCommonUse(code) {
            const uses = {
                200: 'Successful GET, PUT, PATCH requests',
                201: 'Successful POST requests that create resources',
                400: 'Malformed request syntax',
                401: 'Missing or invalid authentication',
                403: 'Valid request, insufficient permissions',
                404: 'Resource not found at specified URL',
                418: 'April Fools\' Day joke, coffee/teapot humor',
                500: 'Unhandled exceptions or server crashes'
            };
            return uses[code] || 'Various server and client scenarios';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
            
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelector('.filter-btn.active').classList.remove('active');
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderGallery();
                });
            });
            
            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTerm = e.target.value;
                renderGallery();
            });
            
            // Modal close on background click
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') {
                    closeModal();
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
                if (e.key === '/' && e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
            });
        });

        // Add smooth scrolling for cards
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Apply fade-in animation to cards as they come into view
        setTimeout(() => {
            document.querySelectorAll('.status-card').forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(card);
            });
        }, 100);
    </script>
</body>
</html>
